name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository invariants
        run: python tools/validate_repo.py

      - name: Test evaluation accounting and grading
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Validate Agent Skills specification
        run: |
          python -m pip install --disable-pip-version-check skills-ref==0.1.1
          agentskills validate skills/system-design-compass

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify skills CLI discovery
        run: npx --yes skills@1.5.26 add . --list

      - name: Smoke-test installation for every supported agent
        env:
          HOME: ${{ runner.temp }}/skill-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/skill-home/.config
        run: |
          mkdir -p "${{ runner.temp }}/install-project"
          cd "${{ runner.temp }}/install-project"
          npx --yes skills@1.5.26 add "$GITHUB_WORKSPACE" \
            --skill system-design-compass \
            --agent '*' \
            --yes --copy --json

      - name: Confirm the checkout stayed clean
        run: git diff --exit-code
