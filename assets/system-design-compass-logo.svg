    <rect x="156" y="340" width="16" height="16" rx="3.5" transform="rotate(45 164 348)" fill="#0b161f" stroke="#2a4b66" stroke-width="1.5"/>
  </g>

  <!-- The Authoritative Copper Failure-Path Route -->
  <g id="authoritative-route">
    <!-- Ambient glowing under-trace -->
    <path d="M 80 256 L 146 256 L 192 210 L 256 256" 
          fill="none" stroke="#e28743" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#traceGlow)"/>
    <!-- Crisp inlaid copper trace -->
    <path d="M 80 256 L 146 256 L 192 210 L 256 256" 
          fill="none" stroke="#f8b677" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Admission boundary ingress node -->
    <circle cx="80" cy="256" r="6.5" fill="#f8b677" stroke="#081118" stroke-width="2.5"/>
    <circle cx="146" cy="256" r="4.5" fill="#d97736" stroke="#081118" stroke-width="1.5"/>
  </g>

  <!-- Multi-Faceted Precision Compass Rose / Needles -->
  <g id="compass-needles">
    <!-- North Needle (Primary Invariant Direction) -->
    <polygon points="256,80 241,256 256,256" fill="url(#copperDark)"/>
    <polygon points="256,80 256,256 271,256" fill="url(#copperLight)"/>

    <!-- South Needle (Counterweight Baseline) -->
    <polygon points="256,422 241,256 256,256" fill="url(#steelDark)"/>
    <polygon points="256,422 256,256 271,256" fill="url(#steelLight)"/>

    <!-- East Needle (System Boundary) -->
    <polygon points="422,256 256,241 256,256" fill="url(#steelLight)"/>
    <polygon points="422,256 256,256 256,271" fill="url(#steelDark)"/>

    <!-- West Needle (Input Ingress Corridor) -->
    <polygon points="90,256 256,241 256,256" fill="url(#copperLight)"/>
    <polygon points="90,256 256,256 256,271" fill="url(#copperDark)"/>
  </g>

  <!-- Authoritative State Hub (Center Bezel, Ivory Core, Micro-Pivot) -->
  <g id="center-hub">
    <!-- Outer burnished copper bezel -->
    <circle cx="256" cy="256" r="34" fill="#070f15" stroke="#c47a3b" stroke-width="2.5"/>
    <!-- Secondary titanium precision ring -->
    <circle cx="256" cy="256" r="25" fill="#0d1b26" stroke="#f8b677" stroke-width="1.5"/>
    <!-- Porcelain Ivory Core (Authoritative State Owner) -->
    <circle cx="256" cy="256" r="15" fill="#f6f1e7" filter="url(#coreGlow)"/>
    <!-- Central micro-pivot point -->
    <circle cx="256" cy="256" r="5.5" fill="#172b3a"/>
  </g>

  <!-- North Cardinal Apex Diamond Marker -->
  <polygon points="256,52 262,60 256,68 250,60" fill="#f8b677" filter="url(#traceGlow)"/>
</svg>