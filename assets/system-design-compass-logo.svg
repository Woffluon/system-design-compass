<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122230"/>
      <stop offset="50%" stop-color="#0a141d"/>
      <stop offset="100%" stop-color="#050a0f"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c47a3b" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#172b3a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a141d" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Copper Needle Gradients -->
    <linearGradient id="copperLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8b677"/>
      <stop offset="100%" stop-color="#d97736"/>
    </linearGradient>

    <linearGradient id="copperDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c46a29"/>
      <stop offset="100%" stop-color="#8a4111"/>
    </linearGradient>

    <!-- Titanium / Steel Counter-Needle Gradients -->
    <linearGradient id="steelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#557d9d"/>
      <stop offset="100%" stop-color="#2c4b64"/>
    </linearGradient>

    <linearGradient id="steelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e364a"/>
      <stop offset="100%" stop-color="#101e29"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="traceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.7  0 0 1 0 0.4  0 0 0 1 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#1e364a" stroke-width="2.5"/>

  <!-- Center Atmospheric Glow -->
  <circle cx="256" cy="256" r="215" fill="url(#centerGlow)"/>

  <!-- Architectural Background Axis Grid Lines -->
  <line x1="256" y1="44" x2="256" y2="468" stroke="#152735" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="44" y1="256" x2="468" y2="256" stroke="#152735" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="106" y1="106" x2="406" y2="406" stroke="#12222f" stroke-width="1.2" stroke-dasharray="2 6"/>
  <line x1="106" y1="406" x2="406" y2="106" stroke="#12222f" stroke-width="1.2" stroke-dasharray="2 6"/>

  <!-- Concentric Dial Rings -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#213a4e" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#162938" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1c3345" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="82" fill="none" stroke="#162938" stroke-width="1" stroke-dasharray="2 4"/>

