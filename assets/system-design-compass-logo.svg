  <!-- System Architecture Boundary Nodes & Speculative Paths -->
  <g id="system-boundaries" opacity="0.8">
    <path d="M 164 164 L 202 202 M 348 164 L 298 214 M 348 348 L 294 294 M 164 348 L 214 298" 
          stroke="#1d3549" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="156" y="156" width="16" height="16" rx="3.5" transform="rotate(45 164 164)" fill="#0b161f" stroke="#2a4b66" stroke-width="1.5"/>
